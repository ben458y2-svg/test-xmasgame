<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>第3章・潛入馬廄</title>
<style>
:root{--bg:#0b0a1a;--ink:#f0f4e8;--g:#7be08a;--gold:#ffcf6b;--red:#ff7b6b;--panel:rgba(12,22,18,.9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overscroll-behavior:none;touch-action:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#g{position:relative;container-type:size;width:min(100vw,calc(100dvh*9/16));height:min(100dvh,calc(100vw*16/9));overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 2cqw) 4cqw 0;font-size:3.6cqw;display:flex;justify-content:space-between;text-shadow:0 .4cqw 0 #000}
.top b{color:var(--g);letter-spacing:.1em}
#sub{position:absolute;left:4cqw;top:calc(env(safe-area-inset-top,0px) + 10cqw);font-size:3.3cqw;text-shadow:0 .3cqw 0 #000;display:flex;gap:4cqw}
#sub b{color:var(--red)}
#fl{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:8cqw;font-weight:900;color:#fff;text-shadow:0 0 4cqw var(--red),0 .8cqw 0 #000;opacity:0;pointer-events:none;transition:opacity .2s}
#dl{position:absolute;left:3cqw;right:3cqw;bottom:calc(env(safe-area-inset-bottom,0px) + 3cqw);background:var(--panel);border:.5cqw solid var(--g);border-radius:2.5cqw;padding:3cqw 4cqw;font-size:3.9cqw;line-height:1.55;min-height:17cqw;pointer-events:none}
button{font:inherit;color:#0c2014;background:var(--g);border:0;border-radius:999px;padding:2.4cqw 7cqw;font-size:4.2cqw;font-weight:700;box-shadow:0 0 3cqw var(--g)}
.ov{position:absolute;inset:0;background:rgba(6,14,10,.86);display:none;flex-direction:column;align-items:center;justify-content:center;gap:3.5cqw;padding:8cqw;text-align:center;font-size:4.1cqw;line-height:1.6}
.ov h2{margin:0;color:var(--g);font-size:6cqw}
.card{background:#1a2a20;border:.5cqw dashed var(--gold);border-radius:3cqw;padding:3.5cqw 5cqw;font-size:3.8cqw;animation:fly 2.4s ease-in-out infinite}
@keyframes fly{50%{transform:translateY(-2.5cqw) rotate(-2deg)}}
.hint{font-size:3.2cqw;opacity:.8}
.rot{position:fixed;inset:0;background:#0b0a1a;display:none;align-items:center;justify-content:center;font-size:5vmin;z-index:9}
@media (orientation:landscape) and (max-height:500px){.rot{display:flex}}
</style>
</head>
<body>
<div id="g">
<canvas id="c" width="180" height="320"></canvas>
<div class="top"><span>第3章　旅途中的考驗</span><b>牧羊人｜潛入馬廄</b></div>
<div id="sub"><span>🗺 完整地圖</span><span>被發現 <b id="cn">0</b> 次</span></div>
<div id="fl">被發現了！</div>
<div id="dl"></div>
<div class="ov" id="intro" style="display:flex"><h2>潛入馬廄</h2>
<div class="card">🗺 收到【完整地圖】<br><small>來自：博士　→　標出守衛與路線</small></div>
<div><b>按住畫面</b>前進，<b>放開</b>就會蹲下躲藏。<br>守衛抬頭<b>亮起光束</b>時，不要在光裡移動！</div>
<div class="hint">被發現只會退回最近的營火，沒有懲罰</div><button id="go">出發偵察</button></div>
<div class="ov" id="win"><h2>偵察完成</h2>
<div class="card">🏚 <b>馬廄辨識記號</b><br><small>已送往【天使】，將在第【4】章派上用場</small></div>
<div id="st" class="hint"></div><button id="rb">再玩一次</button></div>
</div>
<div class="rot">請將手機轉為直向</div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
let sd=12;const r=()=>(sd=sd*16807%2147483647)/2147483647;
const P=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,Math.max(1,w|0),Math.max(1,h|0))},p=(x,y,w,h,c)=>P(ctx,x,y,w,h,c);
const SK='#e0a878';
// bg
const bg=document.createElement('canvas');bg.width=180;bg.height=320;const g=bg.getContext('2d');
P(g,0,0,180,320,'#14221e');for(let i=0;i<500;i++)P(g,r()*180,r()*320,r()>.5?3:1,1,r()>.5?'#1c2e26':'#0e1a16');
P(g,64,70,52,230,'#4a4034');P(g,66,70,48,230,'#5a4e3e');for(let i=0;i<260;i++)P(g,66+r()*46,70+r()*230,2,1,r()>.5?'#4a4034':'#6a5e4a');
[[8,160],[150,100],[10,250],[152,230],[14,60],[148,40]].forEach(([x,y])=>{P(g,x,y,18,10,'#0e1a14');P(g,x+2,y-6,14,8,'#14281c');P(g,x+4,y-9,8,5,'#1c3a26')});
for(let y=90;y<300;y+=26){P(g,58,y,4,8,'#6a6a78');P(g,118,y+10,4,8,'#6a6a78')}
// stable
P(g,48,20,84,56,'#4a2e1a');P(g,40,12,100,14,'#6a4222');P(g,44,10,92,4,'#8a5a30');for(let x=48;x<132;x+=7)P(g,x,26,1,50,'#3a2412');
P(g,72,34,36,42,'#120a06');P(g,74,36,32,40,'#ffb347');P(g,74,36,32,6,'#ffe08a');P(g,88,36,4,40,'#c47a20');P(g,76,66,28,10,'#d8b048');
P(g,82,2,16,10,'#6a4222');
// moon
P(g,18,16,12,12,'#f6f0c8');P(g,22,14,8,8,'#14221e');
// state
const GY=[222,168,118],GS=[-1,1,-1],SD=[[2.2,.75,1.4],[1.8,.65,1.6],[1.4,.55,1.9]],CP=[268,186,132,86],STAB=80;
let gd=[],py=268,cp=0,hold=false,caught=0,cn=0,ph='idle',T=0,last=0,ct=0,moved=false,lg='',won=0;
const say=s=>{if(lg!=s){lg=s;$('dl').innerHTML=s}};
function begin(){py=CP[0];cp=0;cn=0;ph='play';moved=false;ct=0;$('cn').textContent=0;$('intro').style.display=$('win').style.display='none';
 gd=GY.map((y,i)=>({y,s:GS[i],st:'sleep',t:SD[i][0]*(.5+i*.3),i}));say('牧羊人：「風聲很大……先確認馬廄的位置。」')}
$('go').onclick=begin;$('rb').onclick=begin;
const down=()=>{hold=true};const up=()=>{hold=false};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);down()});cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.key==' '||e.key=='ArrowUp'){e.preventDefault();down()}});addEventListener('keyup',e=>{if(e.key==' '||e.key=='ArrowUp')up()});
function guard(x,y,d,st,t){ctx.save();ctx.translate(x,y);const nod=st=='sleep'?2:0;
 p(-5,-19,10,15,'#6a4a4a');p(-5,-19,10,3,'#8a6a6a');p(-4,-28+nod,8,4,'#7a7a88');p(-3,-24+nod,6,5,SK);
 if(st=='sleep')p(-2,-22+nod,4,1,'#222');else{p(-2,-22,1,2,st=='look'?'#fff':'#222');p(1,-22,1,2,st=='look'?'#fff':'#222');if(st=='look')p(-2,-22,1,1,'#c00')}
 p(-3,-4,3,4,'#2a1a10');p(1,-4,3,4,'#2a1a10');p(d*8,-36,1,36,'#8a8a96');p(d*8-1,-38,3,3,'#c0c0d0');
 p(d*5-2,-12,5,6,'#ffd47a');ctx.restore();
 ctx.fillStyle=st=='look'?'#ff7b6b':'#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
 if(st=='sleep'){ctx.globalAlpha=.5+.5*Math.sin(t*3);ctx.fillText('Z',x+d*-8,y-34-((t*8)%8));ctx.fillText('z',x+d*-14,y-40-((t*6)%6));ctx.globalAlpha=1}
 if(st=='warn')ctx.fillText('?',x,y-34);if(st=='look')ctx.fillText('!',x,y-34)}
function shep(x,y,mv,t,hid){ctx.save();ctx.translate(x,y);ctx.scale(1.15,hid?.72:1.15);const leg=Math.sin(t*14)>0,c=hid?['#4a3626','#3a2a1c','#7a6c58']:['#8a5a3a','#6a4028','#c9b48a'];
 p(-4,-26,8,6,c[2]);p(-3,-21,6,3,hid?'#a88060':SK);p(-5,-19,10,15,c[0]);p(1,-19,4,15,c[1]);p(-5,-11,10,1,'#4a2f18');
 p(-3,-4+(mv&&leg?-2:0),3,4,'#2a1a10');p(1,-4+(mv&&!leg?-2:0),3,4,'#2a1a10');p(6,-32,1,32,'#6b4a2a');ctx.restore()}
function frame(now){
 const dt=Math.min(.05,(now-last)/1000||0);last=now;T+=dt;
 if(ph=='play'){
  gd.forEach(o=>{o.t-=dt;if(o.t<=0){if(o.st=='sleep'){o.st='warn';o.t=SD[o.i][1]}else if(o.st=='warn'){o.st='look';o.t=SD[o.i][2];o.lt=0}else{o.st='sleep';o.t=SD[o.i][0]+r()*1.2}}if(o.st=='look')o.lt+=dt});
  const mv=hold&&ct<=0;if(ct>0){ct-=dt;py+=(CP[cp]-py)*Math.min(1,dt*6)}
  if(mv){py-=36*dt;moved=true}
  const seen=gd.find(o=>o.st=='look'&&o.lt>.25&&py>o.y-28&&py<o.y+20);
  if(mv&&seen){ct=.9;caught=1;cn++;$('cn').textContent=cn;const f=$('fl');f.style.opacity=1;setTimeout(()=>f.style.opacity=0,700);say('牧羊人：「糟了！被發現了，退回營火那邊重來。」')}
  CP.forEach((y,i)=>{if(i>cp&&py<y+4){cp=i;if(i<3)say('牧羊人：「第 '+i+' 個守衛過了，營火旁可以喘口氣。」')}});
  if(py<=STAB){ph='win';say('牧羊人：「找到了——這就是馬廄的標記。」');setTimeout(()=>{$('st').textContent='被發現 '+cn+' 次';$('win').style.display='flex'},900)}}
 ctx.drawImage(bg,0,0);
 // camps
 CP.slice(1,4).forEach((y,i)=>{const x=40+(i%2)*100;p(x-5,y+8,10,2,'#2a1a10');p(x-3,y+2,6,6,'#ff7a30');p(x-1,y-1,3,5,'#ffe070')});
 ctx.globalCompositeOperation='lighter';
 gd.forEach(o=>{const a=o.st=='look'?.38+Math.sin(T*20)*.03:o.st=='warn'?.06+Math.sin(T*14)*.04:0;if(a>0){const gx=90+o.s*-50;const x0=gx+(-o.s)*0,fx=90+o.s*40;const gr=ctx.createLinearGradient(gx,0,fx,0);gr.addColorStop(0,`rgba(255,240,150,${a})`);gr.addColorStop(1,`rgba(255,220,100,${a*.4})`);ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(gx+(-o.s)*6*-1,o.y-14);ctx.lineTo(fx,o.y-28);ctx.lineTo(fx,o.y+20);ctx.fill()}});
 const sg=ctx.createRadialGradient(90,66,4,90,66,60);sg.addColorStop(0,`rgba(255,180,80,${.35+Math.sin(T*8)*.05})`);sg.addColorStop(1,'rgba(255,140,40,0)');ctx.fillStyle=sg;ctx.fillRect(20,0,140,130);
 ctx.globalCompositeOperation='source-over';
 gd.forEach(o=>{const x=90+o.s*-50;guard(x,o.y,-o.s*-1===1?1:-1,o.st,T)});
 const mv=ph=='play'&&hold&&ct<=0;shep(90,py,mv,T,!mv&&ph=='play');
 // minimap
 p(168,66,3,210,'rgba(255,255,255,.2)');gd.forEach(o=>p(166,o.y,7,3,o.st=='look'?'#ff7b6b':'#8a8a96'));p(165,py-1,9,4,'#7be08a');p(165,STAB-1,9,2,'#ffcf6b');
 if(ph=='play'&&!moved){ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.fillText('按住畫面 前進　／　放開 躲藏',90,278)}
 if(ct>0){ctx.fillStyle=`rgba(255,80,60,${ct*.3})`;ctx.fillRect(0,0,180,320)}
 const v=ctx.createRadialGradient(90,170,60,90,170,200);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(4,8,6,.6)');ctx.fillStyle=v;ctx.fillRect(0,0,180,320);
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
