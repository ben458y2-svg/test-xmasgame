<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>牧羊人 第2章｜接物避障</title>
<style>
:root{--bg:#0b0a1a;--c:#5ee08a;--g:#ffb347;--tx:#eafff1;color-scheme:dark}
@media (prefers-color-scheme:dark){:root{--bg:#0b0a1a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05040d;overflow:hidden;overscroll-behavior:none;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--tx)}
body{display:grid;place-items:center}
#f{position:relative;width:min(100vw,100dvh*9/16);aspect-ratio:9/16;container-type:inline-size;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.tt,.tb{position:absolute;left:0;right:0;pointer-events:none;backdrop-filter:blur(1.6px);-webkit-backdrop-filter:blur(1.6px)}
.tt{top:0;height:14%;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.tb{bottom:0;height:26%;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
#top{position:absolute;top:0;left:0;right:0;padding:2.4cqw 4cqw;background:linear-gradient(rgba(11,10,26,.85),rgba(11,10,26,0));font-size:3.6cqw;display:flex;gap:2cqw;align-items:baseline}
#top b{color:var(--c);letter-spacing:.3cqw}#top span{opacity:.85}
#miss{position:absolute;top:9cqw;right:4cqw;font-size:3cqw;opacity:.7}
#dlg{position:absolute;left:3.5cqw;right:3.5cqw;bottom:3.5cqw;min-height:22cqw;padding:3cqw 3.8cqw;border:.5cqw solid var(--c);border-radius:3cqw;background:rgba(11,10,26,.82);box-shadow:0 0 5cqw rgba(94,224,138,.3)}
#dlg b{display:block;font-size:3.2cqw;color:var(--c);margin-bottom:1cqw}
#dlg p{margin:0;font-size:4cqw;line-height:1.5}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.5cqw;padding:8cqw;background:rgba(11,10,26,.9);text-align:center}
.ov h2{margin:0;font-size:6cqw;color:var(--c)}
.ov p{margin:0;font-size:3.8cqw;line-height:1.65;opacity:.92}
.item{border:.6cqw dashed var(--g);border-radius:2.5cqw;padding:3cqw 4cqw;color:var(--g);font-size:3.8cqw;line-height:1.5;background:rgba(255,179,71,.07);animation:fl 2.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-1.4cqw)}}
button{min-height:44px;padding:2.4cqw 9cqw;font:inherit;font-size:4.2cqw;color:#06210f;background:var(--c);border:0;border-radius:6cqw;box-shadow:0 0 4cqw rgba(94,224,138,.55)}
#rot{display:none;z-index:9;position:fixed}
@media (orientation:landscape) and (max-height:500px){#rot{display:flex}}
.hide{display:none!important}
</style></head><body>
<div id="f">
<canvas id="cv"></canvas><i class="tt"></i><i class="tb"></i>
<div id="top"><b>牧羊人 · 第 2 章</b><span>接物避障</span></div>
<div id="miss"></div>
<div id="dlg"><b id="who">牧羊人</b><p id="tx"></p></div>
<div id="intro" class="ov"><h2>接物避障</h2>
<p>山坡上的商隊貨車顛簸，貨物一件件滾落下來。<br>左右拖曳籃子，只接住短缺清單上的物資；石頭與荊棘要閃開。</p>
<div class="item">收到道具：短缺清單<br><small>來自 約瑟與瑪利亞 第 1 章<br>水袋 ×2、乾糧 ×2、嬰孩布料 ×2</small></div>
<button id="go">開始</button></div>
<div id="done" class="ov hide"><h2>物資備齊了</h2>
<p id="sum"></p>
<div class="item">備齊的物資<br><small>已寄出，去向與用途<br>請對照原文件確認</small></div>
<button id="again">再玩一次</button></div>
<div id="rot" class="ov"><h2>請轉直向</h2></div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),x=cv.getContext('2d');
const W=180,H=320,PY=226;cv.width=W;cv.height=H;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const hs=n=>{n=Math.sin(n*127.1)*43758.5;return n-Math.floor(n)};
const NEED=[2,2,2],NAMES=['水袋','乾糧','嬰孩布料','涼鞋','銀幣袋','石頭','荊棘'];
let st='intro',px=90,got=[0,0,0],miss=0,stun=0,t=0,spawn=0,pend=0,items=[],pops=[],K={};
const parts=[...Array(14)].map((_,i)=>({x:hs(i)*W,y:150+hs(i+9)*90,s:.4+hs(i+3)}));
function say(w,s){$('who').textContent=w;$('tx').textContent=s}
function reset(){got=[0,0,0];miss=0;stun=0;items=[];pops=[];px=90;spawn=.4;st='play';
 $('intro').classList.add('hide');$('done').classList.add('hide');say('牧羊人','貨物掉下來了！照著清單接。')}
$('go').onclick=reset;$('again').onclick=reset;say('牧羊人','（對白為暫擬，正式版以原腳本為準）');
let pressed=false,lx=0;
cv.addEventListener('pointerdown',e=>{pressed=true;lx=e.clientX;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!pressed)return;pend+=(e.clientX-lx)*W/cv.getBoundingClientRect().width*1.3;lx=e.clientX});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>pressed=false));
addEventListener('keydown',e=>K[e.key]=1);addEventListener('keyup',e=>K[e.key]=0);
function pick(){const r=Math.random(),need=[0,1,2].filter(i=>got[i]<NEED[i]);
 if(r<.58&&need.length)return need[Math.floor(Math.random()*need.length)];
 if(r<.72)return 3+Math.floor(Math.random()*2);return 5+Math.floor(Math.random()*2)}
function step(dt){t+=dt;if(st!=='play')return;
 pend+=((K.ArrowRight||K.d?1:0)-(K.ArrowLeft||K.a?1:0))*95*dt;
 if(stun>0)stun-=dt;else px+=pend;pend=0;px=cl(px,14,W-14);
 const prog=got.reduce((a,b)=>a+b,0)/6;
 spawn-=dt;if(spawn<=0){spawn=.75-prog*.2+Math.random()*.25;
  items.push({x:16+Math.random()*(W-32),y:-8,vy:48+prog*26+Math.random()*14,ty:pick(),r:Math.random()*6,sp:(Math.random()-.5)*5})}
 for(const it of items){it.y+=it.vy*dt;it.r+=it.sp*dt;
  if(!it.dead&&stun<=0&&it.y>PY-24&&it.y<PY-12&&Math.abs(it.x-px)<12){it.dead=1;
   if(it.ty<3){if(got[it.ty]<NEED[it.ty]){got[it.ty]++;pops.push({x:it.x,y:PY-26,t:0,c:'#5ee08a'});say('牧羊人',NAMES[it.ty]+'接到了。'+(got[it.ty]>=NEED[it.ty]?'這項備齊了。':''))}
    else say('牧羊人','這項已經夠了，先放一邊。')}
   else if(it.ty<5)say('牧羊人','清單上沒有'+NAMES[it.ty]+'，讓它滾走。');
   else{stun=.9;miss++;pops.push({x:px,y:PY-30,t:0,c:'#ff9a9a'});say('牧羊人','哎呀！'+NAMES[it.ty]+'！閃開才對。')}}
  if(it.y>H+10)it.dead=1}
 items=items.filter(i=>!i.dead&&i.y<238||i.y<238&&!i.dead);
 pops.forEach(p=>p.t+=dt);pops=pops.filter(p=>p.t<.7);
 $('miss').textContent='失誤 '+miss+' 次（不影響通關）';
 if(got.every((g,i)=>g>=NEED[i])){st='done';$('sum').textContent='清單上的水袋、乾糧與布料都接齊了。共失誤 '+miss+' 次。';$('done').classList.remove('hide');say('牧羊人','夠了，這些足夠讓他們安心。')}}
function R(a,b,w,h,c){x.fillStyle=c;x.fillRect(Math.round(a),Math.round(b),w,h)}
function glow(cx,cy,r,c,a){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');
 x.globalAlpha=a;x.globalCompositeOperation='lighter';x.fillStyle=g;x.fillRect(cx-r,cy-r,2*r,2*r);x.globalAlpha=1;x.globalCompositeOperation='source-over'}
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
{const c=bg.getContext('2d'),g=c.createLinearGradient(0,0,0,240);g.addColorStop(0,'#0b0a1a');g.addColorStop(.6,'#1b1840');g.addColorStop(1,'#2d2552');c.fillStyle=g;c.fillRect(0,0,W,H)}
const vg=document.createElement('canvas');vg.width=W;vg.height=H;
{const c=vg.getContext('2d'),g=c.createRadialGradient(90,170,50,90,170,220);g.addColorStop(0,'rgba(5,4,15,0)');g.addColorStop(1,'rgba(5,4,15,.8)');c.fillStyle=g;c.fillRect(0,0,W,H)}
function hill(base,amp,f,off,col){x.fillStyle=col;for(let a=0;a<W;a++){const y=Math.round(base+Math.sin(a*f+off)*amp+Math.sin(a*f*2.3+off*1.7)*amp*.4);x.fillRect(a,y,1,H-y)}}
function sprite(ty,cx,cy,r){
 if(ty==0){R(cx-4,cy-5,8,10,'#8a5a32');R(cx-3,cy-6,6,2,'#a87040');R(cx-1,cy-8,2,3,'#3a6ad0');R(cx-3,cy-2,2,5,'#a87040')}
 else if(ty==1){R(cx-6,cy-3,12,7,'#d8a860');R(cx-5,cy-4,10,2,'#e8c080');R(cx-3,cy-1,1,3,'#9c6a30');R(cx+1,cy-1,1,3,'#9c6a30')}
 else if(ty==2){R(cx-6,cy-4,12,9,'#f2e8d0');R(cx-6,cy-1,12,1,'#c8bca0');R(cx-6,cy+2,12,1,'#c8bca0')}
 else if(ty==3){R(cx-6,cy-1,12,3,'#7a5530');R(cx-4,cy-3,2,2,'#7a5530');R(cx+1,cy-3,2,2,'#7a5530')}
 else if(ty==4){R(cx-4,cy-4,8,8,'#2a1d30');R(cx-3,cy-6,6,2,'#2a1d30');R(cx-1,cy-1,2,2,'#ffd27a')}
 else if(ty==5){R(cx-6,cy-3,12,7,'#6a6a78');R(cx-4,cy-5,8,2,'#7e7e8c');R(cx-5,cy+2,10,2,'#4c4c58')}
 else{R(cx-1,cy-6,2,12,'#2a5a30');R(cx-6,cy-1,12,2,'#2a5a30');R(cx-4,cy-4,2,2,'#2a5a30');R(cx+3,cy-4,2,2,'#2a5a30');R(cx-4,cy+3,2,2,'#2a5a30');R(cx+3,cy+3,2,2,'#2a5a30');R(cx-1,cy-1,2,2,'#7ad060')}}
function draw(){
 x.drawImage(bg,0,0);
 for(let i=0;i<30;i++){const tw=.4+.6*Math.abs(Math.sin(t*1.5+i));x.globalAlpha=tw;R(hs(i)*W,hs(i+40)*120,1,1,'#fff6d6')}x.globalAlpha=1;
 glow(140,44,26,'#fff2c0',.35);R(137,41,7,7,'#fff2c0');R(139,41,5,7,'#0b0a1a');R(140,41,5,7,'#fff2c0');
 const o=(px-90)*.08;
 hill(190,10,.03,1+o*.02,'#1a1738');hill(205,8,.045,3-o*.03,'#16142e');hill(226,5,.07,5,'#123022');
 R(0,238,W,H-238,'#0f2a1e');for(let a=0;a<W;a+=4)R(a,238+((a*7)%5),1,2,'#1c4a32');
 for(let i=0;i<3;i++){const sx=24+i*52,sy=232+((i*5)%4);R(sx,sy,9,5,'#e8e4f0');R(sx+7,sy-2,4,4,'#c8c4d4');R(sx+1,sy+5,1,2,'#8a8698');R(sx+7,sy+5,1,2,'#8a8698')}
 R(150,226,8,3,'#4a3420');R(152,222,4,4,'#ffb347');R(153,219,2,3,'#ffe27a');glow(154,224,46,'#ffb347',.5+Math.sin(t*9)*.08);
 for(const it of items)sprite(it.ty,it.x,it.y,it.r);
 const fx=px,mv=stun>0?0:Math.floor(t*7)&1,sh=stun>0?(Math.floor(t*30)&1)*2-1:0;
 R(fx-5,PY+6,11,2,'rgba(0,0,0,.45)');
 R(fx-4+sh,PY-6,8,13,'#2f9a5c');R(fx-4+sh,PY+3,8,4,'#1f6e40');R(fx-3+sh,PY-5,6,3,'#5ee08a');
 R(fx-3+sh+mv,PY+7,2,2,'#2a1a14');R(fx+1+sh-mv,PY+7,2,2,'#2a1a14');
 R(fx-3+sh,PY-11,6,5,'#e8c9a0');R(fx-4+sh,PY-12,8,3,'#d8cdb0');R(fx-2+sh,PY-9,1,1,'#2a1a14');R(fx+1+sh,PY-9,1,1,'#2a1a14');
 R(fx+5+sh,PY-14,1,21,'#a87040');R(fx+4+sh,PY-16,3,2,'#a87040');
 R(fx-9+sh,PY-20,18,2,'#a87040');R(fx-9+sh,PY-20,1,7,'#8a5a32');R(fx+8+sh,PY-20,1,7,'#8a5a32');R(fx-8+sh,PY-14,16,2,'#8a5a32');
 glow(fx,PY-6,26,'#5ee08a',.2);
 for(const p of pops){const a=1-p.t/.7;x.globalAlpha=a;R(p.x-1,p.y-p.t*18,3,3,p.c);R(p.x-4,p.y-p.t*14+2,1,1,p.c);R(p.x+4,p.y-p.t*14+2,1,1,p.c);x.globalAlpha=1}
 for(const p of parts){p.y-=p.s*.1;p.x+=Math.sin(t*1.3+p.s*9)*.15;if(p.y<130){p.y=240;p.x=hs(p.s*50+t)*W}
  x.globalAlpha=.4+.4*Math.sin(t*3+p.s*8);R(p.x,p.y,1,1,'#c8ff9a');x.globalAlpha=1}
 x.drawImage(vg,0,0);
 if(stun>.6){x.fillStyle='rgba(255,200,200,.14)';x.fillRect(0,0,W,H)}
 R(4,22,48,34,'rgba(11,10,26,.7)');R(4,22,48,1,'#5ee08a');
 for(let i=0;i<3;i++){const yy=28+i*10;sprite(i,12,yy,0);x.fillStyle=got[i]>=NEED[i]?'#5ee08a':'#eafff1';x.font='bold 8px monospace';x.textBaseline='middle';x.fillText(got[i]+'/'+NEED[i],24,yy+1);
  if(got[i]>=NEED[i])R(46,yy-1,3,3,'#5ee08a')}
}
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;step(dt);draw();requestAnimationFrame(loop)})(last);
</script></body></html>
