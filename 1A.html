<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>第1章・行李危機</title>
<style>
:root{--bg:#0b0a1a;--ink:#f6ecd2;--gold:#ffcf6b;--red:#ff7b6b;--ok:#7be08a;--panel:rgba(14,12,36,.9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overscroll-behavior:none;touch-action:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#g{position:relative;container-type:size;width:min(100vw,calc(100dvh*9/16));height:min(100dvh,calc(100vw*16/9));overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 2cqw) 4cqw 0;font-size:3.6cqw;display:flex;justify-content:space-between;text-shadow:0 .4cqw 0 #000}
.top b{color:var(--gold);letter-spacing:.15em}
#bw{position:absolute;left:4cqw;right:4cqw;top:calc(env(safe-area-inset-top,0px) + 9cqw);height:1.6cqw;background:#241f4a;border-radius:1cqw;overflow:hidden;opacity:0}
#bar{height:100%;width:100%;background:var(--gold)}
#need{position:absolute;right:3cqw;top:calc(env(safe-area-inset-top,0px) + 14cqw);background:var(--panel);border:.5cqw solid var(--gold);border-radius:2cqw;padding:2cqw 2.5cqw;font-size:3.2cqw;line-height:1.7;display:none}
#need div{display:flex;align-items:center;gap:1.5cqw}
img.ic{width:5cqw;height:5cqw;image-rendering:pixelated}
#dl{position:absolute;left:3cqw;right:3cqw;bottom:calc(env(safe-area-inset-bottom,0px) + 3cqw);background:var(--panel);border:.5cqw solid var(--gold);border-radius:2.5cqw;padding:3cqw 4cqw;font-size:4.1cqw;line-height:1.55;min-height:20cqw}
#dl img.ic{width:7cqw;height:7cqw;vertical-align:middle;margin:0 1cqw}
button{font:inherit;color:#16122e;background:var(--gold);border:0;border-radius:999px;padding:2.2cqw 6cqw;font-size:4cqw;font-weight:700;box-shadow:0 0 3cqw var(--gold)}
#btn{display:block;margin:2.5cqw auto 0}
#judge,#res{position:absolute;left:3cqw;right:3cqw;bottom:calc(env(safe-area-inset-bottom,0px) + 28cqw);top:24cqw;background:var(--panel);border:.5cqw solid var(--gold);border-radius:3cqw;padding:4cqw;display:none;flex-direction:column;gap:2cqw;font-size:4cqw}
#judge h3,#res h3{margin:0;color:var(--gold);font-size:4.6cqw}
.row{display:flex;align-items:center;gap:3cqw;padding:2cqw 3cqw;border:.4cqw solid #4a4380;border-radius:2cqw;background:#1c1840}
.row.on{border-color:var(--gold);background:#3a2f12}
.row span{flex:1}.row em{font-style:normal;color:var(--red)}
.row img.ic{width:8cqw;height:8cqw}
#jb{margin:auto auto 0}
.card{margin:auto;text-align:center;background:#1c1840;border:.5cqw dashed var(--gold);border-radius:3cqw;padding:4cqw;animation:fly 2.4s ease-in-out infinite}
@keyframes fly{50%{transform:translateY(-3cqw) rotate(-2deg)}}
.sk{animation:sk .3s}
@keyframes sk{25%{transform:translateX(-1.5cqw)}75%{transform:translateX(1.5cqw)}}
.rot{position:fixed;inset:0;background:#0b0a1a;display:none;align-items:center;justify-content:center;font-size:5vmin;z-index:9}
@media (orientation:landscape) and (max-height:500px){.rot{display:flex}}
</style>
</head>
<body>
<div id="g">
<canvas id="c" width="180" height="320"></canvas>
<div class="top"><span>第1章　命運的起點</span><b id="tp">1/4 準備</b></div>
<div id="bw"><div id="bar"></div></div>
<div id="need"></div>
<div id="judge"><h3>清點：哪些物資不夠？（可多選）</h3><div id="rows" style="display:flex;flex-direction:column;gap:2cqw"></div><button id="jb">確認短缺的物資</button></div>
<div id="res"><h3>關卡完成</h3><div id="rt" style="line-height:1.6"></div><div class="card" id="cd"></div><button id="rb" style="margin:auto auto 0;background:#8a84c0;box-shadow:none">再玩一次</button></div>
<div id="dl"><div id="tx"></div><button id="btn">開始檢查</button></div>
</div>
<div class="rot">請將手機轉為直向</div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
let sd=5;const r=()=>(sd=sd*16807%2147483647)/2147483647;
const P=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,w,h)},p=(x,y,w,h,c)=>P(ctx,x,y,w,h,c);
const IC={
water:[['...kk...','..kkkk..','..bbbb..','.bbhbbb.','.bbhbbb.','.bbbbbb.','..bbbb..','........'],{k:'#4a2f1e',b:'#a0693a',h:'#d09a62'}],
bread:[['........','..hhhh..','.hbbbbh.','.bhbbhb.','.bbbbbb.','..bbbb..','........','........'],{b:'#d9a050',h:'#f0c878'}],
lamp:[['...kk...','..kkkk..','..yyyy..','..yfyy..','..yyyy..','..kkkk..','.kkkkkk.','........'],{k:'#5a3a20',y:'#ffd47a',f:'#fff2b0'}],
blank:[['........','.rrrrrr.','.rwrwrr.','.rrrrrr.','.rwrwrr.','.rrrrrr.','........','........'],{r:'#b04a4a',w:'#e8c8a0'}],
sand:[['........','........','.bb..bb.','.bb..bb.','.bb..bb.','.kk..kk.','........','........'],{b:'#a0693a',k:'#4a2f1e'}],
coin:[['...kk...','..kkkk..','.bbbbbb.','bbbyybbb','bbbyybbb','bbbbbbbb','.bbbbbb.','........'],{k:'#4a3a6a',b:'#6a4a8a',y:'#ffd700'}],
cloth:[['........','.wwwwww.','.wbwwbw.','.wwwwww.','.wbwwbw.','.wwwwww.','........','........'],{w:'#f4efe0',b:'#9ab8e0'}]};
function ico(g,k,x,y,s){const[m,c]=IC[k];m.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch!='.')P(g,x+i*s,y+j*s,s,s,c[ch])}))}
const url=k=>{const c=document.createElement('canvas');c.width=c.height=8;ico(c.getContext('2d'),k,0,0,1);return c.toDataURL()};
const im=k=>`<img class="ic" src="${url(k)}">`;
// background
const bg=document.createElement('canvas');bg.width=180;bg.height=320;const g=bg.getContext('2d');
P(g,0,0,180,150,'#4b3626');for(let i=0;i<260;i++)P(g,r()*180,r()*140,2,1,r()>.5?'#3e2c1f':'#5c4532');
for(let y=0;y<150;y+=14)P(g,0,y,180,1,'#3a2a1c');
P(g,116,24,42,50,'#2a1c14');for(let y=0;y<46;y++)P(g,119,27+y,36,1,y<20?'#1a1450':y<34?'#2a1c6a':'#4a2a78');
P(g,136,28,1,44,'#2a1c14');P(g,119,50,36,1,'#2a1c14');P(g,128,34,2,2,'#fff6c8');P(g,127,33,4,1,'#ffe9a0');P(g,129,32,1,5,'#ffe9a0');
for(let i=0;i<8;i++)P(g,120+r()*34,28+r()*18,1,1,'#bcb6ff');
P(g,8,76,50,3,'#7a5230');P(g,12,79,3,8,'#5a3a20');P(g,50,79,3,8,'#5a3a20');
P(g,32,62,10,14,'#a0693a');P(g,34,58,6,4,'#8a5a30');
P(g,0,150,180,170,'#241810');for(let i=0;i<200;i++)P(g,r()*180,250+r()*70,2,1,'#1a100a');
P(g,10,142,160,112,'#7a4a24');P(g,12,144,156,108,'#9a6a3a');
for(let y=150;y<250;y+=16)P(g,12,y,156,1,'#865a30');
P(g,12,144,156,2,'#c08a52');P(g,10,252,160,4,'#4a2c14');P(g,16,256,6,34,'#4a2c14');P(g,158,256,6,34,'#4a2c14');
const SK='#e0a878';
function body(x,robe,sh,top){p(x-3,-26,6,2,top);p(x-3,-25,6,5,SK);p(x-2,-23,1,1,'#222');p(x+1,-23,1,1,'#222');p(x-4,-20,8,18,robe);p(x+1,-20,3,18,sh);p(x-5,-19,2,9,robe);p(x+3,-19,2,9,sh);p(x-5,-10,2,2,SK);p(x+3,-10,2,2,SK);p(x-3,-2,3,2,'#2a1a10');p(x+1,-2,3,2,'#2a1a10')}
function bub(x,y,t){p(x-6,y-6,12,10,'#fff');p(x-2,y+4,3,2,'#fff');ctx.fillStyle='#222';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.fillText(t,x,y+3)}
// game data
const NEED=[['water','水袋',3],['bread','乾糧',4],['cloth','嬰孩布料',2],['lamp','油燈',1],['blank','毯子',1]],HAVE={water:1,bread:2,cloth:0,lamp:1,blank:1};
const NM={water:'水袋',bread:'乾糧',lamp:'油燈'},COLS=[36,90,144],ROWS=[172,220];
const sp=i=>({x:COLS[i%3],y:ROWS[i/3|0]});
let items=[],ph='intro',t0=0,tg=[],ti=0,mist=0,sel=new Set(),tries=0,shake=0,busy=false;
function reset(){const ord=[0,1,2,3,4,5].sort(()=>r()-.5);items=[['water',1],['bread',2],['lamp',1],['blank',1],['sand',1],['coin',1]].map(([k,q],j)=>({k,q,sl:ord[j],x:sp(ord[j]).x,y:sp(ord[j]).y,cov:false,found:false,rev:false}));tg=['water','bread','lamp'].sort(()=>r()-.5);ti=0;mist=0;sel=new Set();tries=0;busy=false}
function go(n){ph=n;t0=performance.now();const tx=$('tx'),b=$('btn');b.style.display='none';$('bw').style.opacity=0;$('need').style.display='none';$('judge').style.display=$('res').style.display='none';
 if(n=='intro'){reset();$('tp').textContent='1/4 準備';tx.textContent='約瑟：「放心！我剛剛已經把所有東西都……咦？」';b.style.display='block';b.textContent='開始檢查';b.onclick=()=>go('memo')}
 if(n=='memo'){$('tp').textContent='1/4 記憶';tx.textContent='瑪利亞：「照清單一樣一樣檢查。」記住桌上用品的位置和數量！';$('bw').style.opacity=1;$('need').style.display='block';
  $('need').innerHTML='<b style="color:var(--gold)">行程清單</b>'+NEED.map(([k,n,q])=>`<div>${im(k)}${n} ×${q}</div>`).join('')}
 if(n=='shuffle'){$('tp').textContent='2/4 弄亂了';tx.textContent='約瑟：「糟了！風把桌上的東西吹亂了！」';items.forEach(i=>i.cov=true);let n2=0;const sw=()=>{if(n2++>=6){go('find');return}const a=items[r()*6|0];let b2;do{b2=items[r()*6|0]}while(b2==a);[a.sl,b2.sl]=[b2.sl,a.sl];shake=6;setTimeout(sw,420)};setTimeout(sw,500)}
 if(n=='find'){$('tp').textContent='3/4 找回必需品';fq()}
 if(n=='judge'){$('tp').textContent='4/4 清點';tx.textContent='瑪利亞：「想想桌上實際有多少，哪些不夠？」';$('judge').style.display='flex';rows()}
 if(n=='res'){$('tp').textContent='完成';tx.textContent='約瑟：「找到了！不過布料和水還是不夠。」\n瑪利亞：「把短缺的東西記下來，說不定路上會有人願意幫忙。」';$('res').style.display='flex';
  $('rt').innerHTML=`失誤 ${mist} 次。<br>缺項：水袋、乾糧、嬰孩布料`;$('cd').innerHTML='📜 <b>短缺清單</b><br><small>已送往【牧羊人】，將在第【2】章派上用場</small>'}}
function fq(){$('tx').innerHTML=`【尋找】點開籃子，找出 ${im(tg[ti])}<b>${NM[tg[ti]]}</b>（${ti+1}/3）`}
function rows(){const R=$('rows');R.innerHTML='';NEED.forEach(([k,n,q])=>{const d=document.createElement('div');d.className='row'+(sel.has(k)?' on':'');d.innerHTML=`${im(k)}<span>${n}</span><em>需 ${q}${tries>=2?`｜現有 ${HAVE[k]}`:''}</em>`;d.onclick=()=>{sel.has(k)?sel.delete(k):sel.add(k);rows()};R.appendChild(d)})}
$('jb').onclick=()=>{const ok=['water','bread','cloth'];if(sel.size==3&&ok.every(k=>sel.has(k)))go('res');else{tries++;$('judge').classList.add('sk');setTimeout(()=>$('judge').classList.remove('sk'),300);$('tx').textContent=tries>=2?'提示：已顯示現有數量，比較看看吧。':'瑪利亞：「再回想一下桌上的數量。」';rows()}};
$('rb').onclick=()=>go('intro');
cv.addEventListener('pointerdown',e=>{if(ph!='find'||busy)return;const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*180,y=(e.clientY-b.top)/b.height*320;
 const it=items.find(i=>i.cov&&Math.abs(i.x-x)<22&&Math.abs(i.y-y)<20);if(!it)return;busy=true;it.cov=false;
 setTimeout(()=>{if(it.k==tg[ti]){it.found=true;ti++;busy=false;if(ti>=3){setTimeout(()=>go('judge'),500)}else fq()}else{it.cov=true;mist++;shake=8;busy=false;$('tx').innerHTML='約瑟：「不是這個……」<br>'+$('tx').innerHTML.split('<br>').pop()}},650)});
// draw
function frame(t){
 ctx.drawImage(bg,0,0);
 const f=.85+Math.sin(t/130)*.08;ctx.globalCompositeOperation='lighter';
 const gr=ctx.createRadialGradient(37,72,2,37,72,90);gr.addColorStop(0,`rgba(255,170,70,${.5*f})`);gr.addColorStop(1,'rgba(255,100,30,0)');ctx.fillStyle=gr;ctx.fillRect(0,0,180,200);ctx.globalCompositeOperation='source-over';
 p(34,66,6,6,'#ffd47a');p(35,64,4,2,'#5a3a20');
 const bob=Math.sin(t/600);
 ctx.save();ctx.translate(48,142);ctx.scale(1.5,1.5);body(0,'#b27a30','#8a5a22','#4a2f1e');p(-3,-21,6,2,'#4a2f1e');p(9,-34,1,34,'#6b4a2a');ctx.restore();
 ctx.save();ctx.translate(112,142+bob*.8);ctx.scale(1.5,1.5);body(0,'#3a5fb0','#2c4a90','#f2efe6');p(-4,-25,1,8,'#f2efe6');p(3,-25,1,8,'#f2efe6');p(2,-12,4,5,'#4d78cc');ctx.restore();
 if(ph=='intro')bub(48,96,'?');if(ph=='shuffle')bub(48,96,'!');
 const sh=shake>0?Math.sin(t/20)*shake*.2:0;if(shake>0)shake-=.3;
 items.forEach(i=>{const T=sp(i.sl);i.x+=(T.x-i.x)*.2;i.y+=(T.y-i.y)*.2;const x=i.x+sh,y=i.y;
  p(x-14,y+14,28,2,'rgba(0,0,0,.25)');
  if(i.cov){p(x-13,y-9,26,22,'#6a4420');p(x-12,y-10,24,20,'#8a6238');for(let k=-8;k<10;k+=5)p(x+k,y-10,1,20,'#6a4420');for(let k=-6;k<10;k+=6)p(x-12,y+k,24,1,'#6a4420');p(x-4,y-13,8,4,'#5a3a20')}
  else{ico(ctx,i.k,x-12,y-12,3);for(let d=0;d<i.q;d++)p(x-4+d*5-(i.q-1)*2.5,y+15,3,2,'#ffe9a0');if(i.found){p(x+8,y-14,8,8,'#2a7a3a');p(x+9,y-11,2,2,'#fff');p(x+11,y-9,2,2,'#fff');p(x+13,y-12,2,2,'#fff')}}});
 ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,200,110,.5)';for(let i=0;i<14;i++){const px=(i*37+t/60)%180,py=120+((i*53+t/40)%130);ctx.fillRect(px|0,py|0,1,1)}ctx.globalCompositeOperation='source-over';
 if(ph=='memo'){const e=Math.min(1,(t-t0)/8000);$('bar').style.width=(100-e*100)+'%';if(e>=1)go('shuffle')}
 requestAnimationFrame(frame)}
go('intro');requestAnimationFrame(frame);
</script>
</body>
</html>
